[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "still-alive"
version = "0.1.0"
description = "Still Alive private, self-hosted digital content delivery system"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyotp>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "playwright>=1.55,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-playwright>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
markers = [
    "e2e: browser-based acceptance tests (opt-in with RUN_E2E=1)",
]
