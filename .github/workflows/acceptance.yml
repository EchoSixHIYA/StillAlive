name: acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run full regression
        run: python -m pytest -q
      - name: Run browser acceptance
        env:
          RUN_E2E: "1"
        run: python -m pytest -q tests/test_e2e_browser.py -m e2e
      - name: Run strict OCI release and offline restore acceptance
        env:
          RUN_OCI: "1"
        run: python -m pytest -q tests/test_releases.py::test_l01_l02_l03_release_export_and_offline_restore
