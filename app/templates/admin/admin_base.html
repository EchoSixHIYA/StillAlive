{% extends "base.html" %}

{% block title %}{% block admin_title %}Still Alive · 管理后台{% endblock %}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}">
<div class="admin-layout">
  <header class="admin-header">
    <div>
      <p class="eyebrow">Still Alive</p>
      <h1>管理后台</h1>
    </div>
    <form action="/admin/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="button button-secondary">退出登录</button>
    </form>
  </header>
  <nav class="admin-nav" aria-label="管理导航">
    <a href="/admin">总览</a>
    <a href="/admin/setup">首次配置</a>
    <a href="/admin/people">人物</a>
    <a href="/admin/questions">问题</a>
    <a href="/admin/identity-integrity">身份完整性</a>
    <a href="/admin/simulator">模拟器</a>
    <a href="/admin/audit">审计</a>
    <a href="/admin/releases">封存版本</a>
  </nav>
  {% block admin_content %}{% endblock %}
</div>
{% endblock %}
