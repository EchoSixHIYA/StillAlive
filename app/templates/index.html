{% extends "base.html" %}

{% block title %}Still Alive · 开始识别{% endblock %}

{% block content %}
<section class="hero" aria-labelledby="page-title">
  <p class="eyebrow">Still Alive</p>
  <h1 id="page-title">长期可恢复的定向数字内容交付系统</h1>
  <p class="lede">通过少量低隐私问题，尝试找回与你有关的定向内容。</p>
  <form action="/start" method="post" data-start-discovery><button type="submit">开始识别</button></form>
</section>
<script src="{{ url_for('static', path='start.js') }}" defer></script>
<section class="notice" aria-label="隐私提示">
  <strong>隐私提示</strong>
  <p>识别过程中不展示人物名单、候选评分、验证答案或任何密钥。你可以随时停止。</p>
</section>
{% endblock %}
