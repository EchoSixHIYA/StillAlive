{% extends "base.html" %}

{% block title %}Still Alive · 找回一份只属于你的信{% endblock %}

{% block content %}
<section class="hero" aria-labelledby="page-title">
  <p class="eyebrow">Still Alive</p>
  <h1 id="page-title">找回一份只属于你的信</h1>
  <p class="lede">通过少量低隐私问题，找回一份为你准备的内容。</p>
  <p class="delivery-mode"><strong>当前交付模式：</strong>服务启动后即可交付，不等待死亡、倒计时或心跳触发。</p>
  <form action="/start" method="post" data-start-discovery><button type="submit">开始识别</button></form>
</section>
<script src="{{ url_for('static', path='start.js') }}" defer></script>
<section class="notice" aria-label="隐私提示">
  <strong>隐私提示</strong>
  <p>识别过程中不展示人物名单、候选评分、验证答案或任何密钥。你可以随时停止。验证通过后，下载链接只在短时间内有效，并按一次性授权规则消耗。</p>
</section>
{% endblock %}
